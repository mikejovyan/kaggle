[project]
name = "utils"
version = "0.0.1"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = [
    "C4",
    "E",
    "F",
    "FA",
    "FIX",
    "I",
    "ICN",
    "ISC",
    "NPY",
    "PTH",
    "RET",
    "SIM",
    "TC",
    "TID",
    "UP",
    "W",
]
ignore = ["F401"]
